<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>file-utils 功能测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .test-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        input[type="file"] {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border: 2px dashed #ddd;
            border-radius: 8px;
            width: 100%;
        }
        
        .result {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #e0e0e0;
        }
        
        .result pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .success {
            color: #28a745;
            font-weight: bold;
        }
        
        .error {
            color: #dc3545;
            font-weight: bold;
        }
        
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 file-utils 功能测试</h1>
        <p class="subtitle">完整的文件操作工具库功能演示</p>
        
        <div class="info">
            <strong>💡 使用说明：</strong>
            <p>1. 选择一个文件开始测试</p>
            <p>2. 点击各个功能按钮查看结果</p>
            <p>3. 所有测试结果将显示在下方区域</p>
        </div>
        
        <!-- 文件选择 -->
        <div class="section">
            <h2>📂 选择测试文件</h2>
            <input type="file" id="fileInput" multiple>
            <div class="result" id="fileInfo"></div>
        </div>
        
        <!-- 文件读取 -->
        <div class="section">
            <h2>📖 文件读取</h2>
            <div class="test-group">
                <button onclick="testReadTxt()">读取 TXT</button>
                <button onclick="testReadCsv()">读取 CSV</button>
                <button onclick="testReadJson()">读取 JSON</button>
                <button onclick="testReadAsBase64()">读取为 Base64</button>
            </div>
            <div class="result" id="readResult"></div>
        </div>
        
        <!-- 文件验证 -->
        <div class="section">
            <h2>✅ 文件验证</h2>
            <div class="test-group">
                <button onclick="testCheckFileType()">检查文件类型</button>
                <button onclick="testCheckFileSize()">检查文件大小</button>
                <button onclick="testIsImage()">是否图片</button>
                <button onclick="testGetImageDimensions()">获取图片尺寸</button>
                <button onclick="testValidateFile()">综合验证</button>
            </div>
            <div class="result" id="validateResult"></div>
        </div>
        
        <!-- 文件信息 -->
        <div class="section">
            <h2>ℹ️ 文件信息</h2>
            <div class="test-group">
                <button onclick="testGetFileExtension()">获取扩展名</button>
                <button onclick="testGetFileName()">获取文件名</button>
                <button onclick="testGetFileInfo()">获取完整信息</button>
                <button onclick="testFormatFileSize()">格式化大小</button>
            </div>
            <div class="result" id="infoResult"></div>
        </div>
        
        <!-- 文件生成 -->
        <div class="section">
            <h2>📝 文件生成</h2>
            <div class="test-group">
                <button onclick="testGenerateTxt()">生成 TXT</button>
                <button onclick="testGenerateCsv()">生成 CSV</button>
                <button onclick="testGenerateJson()">生成 JSON</button>
            </div>
            <div class="result" id="generateResult"></div>
        </div>
        
        <!-- 文件转换 -->
        <div class="section">
            <h2>🔄 文件转换</h2>
            <div class="test-group">
                <button onclick="testFileToBase64()">File 转 Base64</button>
                <button onclick="testBase64ToFile()">Base64 转 Blob</button>
            </div>
            <div class="result" id="convertResult"></div>
        </div>
        
        <!-- 文件下载 -->
        <div class="section">
            <h2>⬇️ 文件下载</h2>
            <div class="test-group">
                <button onclick="testDownloadFromUrl()">从 URL 下载</button>
                <button onclick="testDownloadBlob()">下载 Blob</button>
                <button onclick="testDownloadBase64()">下载 Base64</button>
            </div>
            <div class="result" id="downloadResult"></div>
        </div>
    </div>
    
    <script type="module">
        import {
            readFile,
            readTxtFile,
            readCsvFile,
            readJsonFile,
            downloadFile,
            downloadBlob,
            downloadBase64,
            fileToBase64,
            base64ToBlob,
            generateTxtFile,
            generateCsvFile,
            generateJsonFile,
            checkFileType,
            checkFileSize,
            isImage,
            getImageDimensions,
            validateFile,
            getFileExtension,
            getFileNameWithoutExtension,
            getFileInfo,
            formatFileSize
        } from './src/index.ts';
        
        let currentFile = null;
        
        // 文件选择监听
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                currentFile = files[0];
                showFileInfo(files);
            }
        });
        
        // 显示文件信息
        function showFileInfo(files) {
            const infoDiv = document.getElementById('fileInfo');
            let html = '<h4>已选择的文件：</h4>';
            
            Array.from(files).forEach((file, index) => {
                html += `
                    <div style="margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px;">
                        <strong>文件 ${index + 1}:</strong> ${file.name}<br>
                        <strong>类型:</strong> ${file.type || '未知'}<br>
                        <strong>大小:</strong> ${formatFileSize(file.size)} (${file.size} 字节)<br>
                        <strong>扩展名:</strong> ${getFileExtension(file)}
                    </div>
                `;
            });
            
            infoDiv.innerHTML = html;
        }
        
        // ========== 文件读取测试 ==========
        window.testReadTxt = async () => {
            if (!currentFile) return alert('请先选择文件');
            try {
                const content = await readTxtFile(currentFile);
                document.getElementById('readResult').innerHTML = `
                    <h4>TXT 读取结果：</h4>
                    <pre>${content.substring(0, 500)}${content.length > 500 ? '...' : ''}</pre>
                    <p class="success">✓ 读取成功，共 ${content.length} 字符</p>
                `;
            } catch (error) {
                document.getElementById('readResult').innerHTML = `
                    <p class="error">✗ 读取失败：${error.message}</p>
                `;
            }
        };
        
        window.testReadCsv = async () => {
            if (!currentFile) return alert('请先选择文件');
            try {
                const data = await readCsvFile(currentFile);
                document.getElementById('readResult').innerHTML = `
                    <h4>CSV 读取结果：</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p class="success">✓ 解析成功，共 ${data.length} 行数据</p>
                `;
            } catch (error) {
                document.getElementById('readResult').innerHTML = `
                    <p class="error">✗ 解析失败：${error.message}</p>
                `;
            }
        };
        
        window.testReadJson = async () => {
            if (!currentFile) return alert('请先选择文件');
            try {
                const data = await readJsonFile(currentFile);
                document.getElementById('readResult').innerHTML = `
                    <h4>JSON 读取结果：</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p class="success">✓ 解析成功</p>
                `;
            } catch (error) {
                document.getElementById('readResult').innerHTML = `
                    <p class="error">✗ 解析失败：${error.message}</p>
                `;
            }
        };
        
        window.testReadAsBase64 = async () => {
            if (!currentFile) return alert('请先选择文件');
            try {
                const base64 = await readFile(currentFile, 'dataURL');
                document.getElementById('readResult').innerHTML = `
                    <h4>Base64 结果：</h4>
                    <pre>${base64.substring(0, 200)}...</pre>
                    <p class="success">✓ 转换成功，长度：${base64.length}</p>
                `;
            } catch (error) {
                document.getElementById('readResult').innerHTML = `
                    <p class="error">✗ 转换失败：${error.message}</p>
                `;
            }
        };
        
        // ========== 文件验证测试 ==========
        window.testCheckFileType = () => {
            if (!currentFile) return alert('请先选择文件');
            const isImageFile = checkFileType(currentFile, ['image/*']);
            const isPdf = checkFileType(currentFile, ['application/pdf']);
            document.getElementById('validateResult').innerHTML = `
                <h4>文件类型检查：</h4>
                <p>是否为图片：${isImageFile ? '✓ 是' : '✗ 否'}</p>
                <p>是否为 PDF：${isPdf ? '✓ 是' : '✗ 否'}</p>
            `;
        };
        
        window.testCheckFileSize = () => {
            if (!currentFile) return alert('请先选择文件');
            const isValid = checkFileSize(currentFile, 5 * 1024 * 1024); // 5MB
            document.getElementById('validateResult').innerHTML = `
                <h4>文件大小检查（限制 5MB）：</h4>
                <p>当前大小：${formatFileSize(currentFile.size)}</p>
                <p class="${isValid ? 'success' : 'error'}">${isValid ? '✓ 符合要求' : '✗ 超出限制'}</p>
            `;
        };
        
        window.testIsImage = () => {
            if (!currentFile) return alert('请先选择文件');
            const result = isImage(currentFile);
            document.getElementById('validateResult').innerHTML = `
                <h4>图片判断：</h4>
                <p class="${result ? 'success' : 'error'}">${result ? '✓ 是图片文件' : '✗ 不是图片文件'}</p>
            `;
        };
        
        window.testGetImageDimensions = async () => {
            if (!currentFile) return alert('请先选择文件');
            if (!isImage(currentFile)) return alert('请选择图片文件');
            try {
                const dimensions = await getImageDimensions(currentFile);
                document.getElementById('validateResult').innerHTML = `
                    <h4>图片尺寸：</h4>
                    <p>宽度：${dimensions.width}px</p>
                    <p>高度：${dimensions.height}px</p>
                `;
            } catch (error) {
                document.getElementById('validateResult').innerHTML = `
                    <p class="error">✗ 获取失败：${error.message}</p>
                `;
            }
        };
        
        window.testValidateFile = async () => {
            if (!currentFile) return alert('请先选择文件');
            const result = await validateFile(currentFile, {
                acceptTypes: ['image/*', 'application/pdf'],
                maxSize: 10 * 1024 * 1024,
                mustBeImage: false
            });
            
            document.getElementById('validateResult').innerHTML = `
                <h4>综合验证结果：</h4>
                <p class="${result.valid ? 'success' : 'error'}">
                    ${result.valid ? '✓ 验证通过' : '✗ 验证失败'}
                </p>
                ${result.errors.length > 0 ? `<pre>${result.errors.join('\n')}</pre>` : ''}
            `;
        };
        
        // ========== 文件信息测试 ==========
        window.testGetFileExtension = () => {
            if (!currentFile) return alert('请先选择文件');
            const ext = getFileExtension(currentFile);
            document.getElementById('infoResult').innerHTML = `
                <h4>文件扩展名：</h4>
                <p>${ext || '(无扩展名)'}</p>
            `;
        };
        
        window.testGetFileName = () => {
            if (!currentFile) return alert('请先选择文件');
            const name = getFileNameWithoutExtension(currentFile);
            document.getElementById('infoResult').innerHTML = `
                <h4>文件名（不含扩展名）：</h4>
                <p>${name}</p>
            `;
        };
        
        window.testGetFileInfo = () => {
            if (!currentFile) return alert('请先选择文件');
            const info = getFileInfo(currentFile);
            document.getElementById('infoResult').innerHTML = `
                <h4>完整文件信息：</h4>
                <pre>${JSON.stringify(info, null, 2)}</pre>
            `;
        };
        
        window.testFormatFileSize = () => {
            if (!currentFile) return alert('请先选择文件');
            const sizes = [
                currentFile.size,
                1024,
                1048576,
                1073741824
            ];
            document.getElementById('infoResult').innerHTML = `
                <h4>文件大小格式化：</h4>
                <p>当前文件：${formatFileSize(currentFile.size)}</p>
                <p>1 KB 示例：${formatFileSize(1024)}</p>
                <p>1 MB 示例：${formatFileSize(1048576)}</p>
                <p>1 GB 示例：${formatFileSize(1073741824)}</p>
            `;
        };
        
        // ========== 文件生成测试 ==========
        window.testGenerateTxt = () => {
            generateTxtFile('这是一个测试文本文件\n第二行内容\n第三行内容', 'test.txt');
            document.getElementById('generateResult').innerHTML = `
                <p class="success">✓ TXT 文件已生成并触发下载</p>
            `;
        };
        
        window.testGenerateCsv = () => {
            const data = [
                { name: '张三', age: 25, city: '北京' },
                { name: '李四', age: 30, city: '上海' },
                { name: '王五', age: 28, city: '广州' }
            ];
            generateCsvFile(data, 'users.csv');
            document.getElementById('generateResult').innerHTML = `
                <p class="success">✓ CSV 文件已生成并触发下载</p>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        };
        
        window.testGenerateJson = () => {
            const data = {
                name: '测试用户',
                age: 25,
                hobbies: ['阅读', '游泳', '编程'],
                address: {
                    city: '北京',
                    district: '朝阳区'
                }
            };
            generateJsonFile(data, 'user.json');
            document.getElementById('generateResult').innerHTML = `
                <p class="success">✓ JSON 文件已生成并触发下载</p>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        };
        
        // ========== 文件转换测试 ==========
        window.testFileToBase64 = async () => {
            if (!currentFile) return alert('请先选择文件');
            try {
                const base64 = await fileToBase64(currentFile);
                document.getElementById('convertResult').innerHTML = `
                    <h4>File 转 Base64：</h4>
                    <pre>${base64.substring(0, 200)}...</pre>
                    <p class="success">✓ 转换成功</p>
                `;
            } catch (error) {
                document.getElementById('convertResult').innerHTML = `
                    <p class="error">✗ 转换失败：${error.message}</p>
                `;
            }
        };
        
        window.testBase64ToFile = () => {
            const base64 = 'data:text/plain;base64,SGVsbG8gV29ybGQh';
            const blob = base64ToBlob(base64);
            document.getElementById('convertResult').innerHTML = `
                <h4>Base64 转 Blob：</h4>
                <pre>MIME 类型：${blob.type}\n大小：${blob.size} 字节</pre>
                <p class="success">✓ 转换成功</p>
            `;
        };
        
        // ========== 文件下载测试 ==========
        window.testDownloadFromUrl = async () => {
            try {
                await downloadFile('https://httpbin.org/image/png', 'test-image.png');
                document.getElementById('downloadResult').innerHTML = `
                    <p class="success">✓ 下载请求已发送</p>
                `;
            } catch (error) {
                document.getElementById('downloadResult').innerHTML = `
                    <p class="error">✗ 下载失败：${error.message}</p>
                `;
            }
        };
        
        window.testDownloadBlob = () => {
            const blob = new Blob(['Hello World!'], { type: 'text/plain' });
            downloadBlob(blob, 'hello.txt');
            document.getElementById('downloadResult').innerHTML = `
                <p class="success">✓ Blob 文件已下载</p>
            `;
        };
        
        window.testDownloadBase64 = () => {
            const base64 = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0icmVkIiAvPjwvc3ZnPg==';
            downloadBase64(base64, 'test.svg');
            document.getElementById('downloadResult').innerHTML = `
                <p class="success">✓ Base64 文件已下载</p>
            `;
        };
    </script>
</body>
</html>
